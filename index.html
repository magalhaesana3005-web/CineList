<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Gerenciador de Filmes</title>
</head>
<body>

    
    <header>
        <h1>CineList</h1>
        <p>Sistema Integrado de Gerenciamento de Filmes e Séries</p>
        <nav>
            <ul>
                <li><a href="#cadastro">Cadastrar Filme</a></li>
                <li><a href="#listagem">Catálogo</a></li>
                <li><a href="#detalhes">Detalhes</a></li>
            </ul>
        </nav>
    </header>

    <section id="cadastro">
            <h2>Cadastrar Filme</h2>
            <form>
                <label for="titulo">Título:</label>
                <input type="text" id="titulo"><br><br>

                <label for="categoria">Categoria:</label>
                <select id="categoria">
                    <option value="romance">Romance</option>
                    <option value="fantasia">Fantasia</option>
                </select><br><br>

                <label for="ano">Ano:</label>
                <input type="number" id="ano"><br><br>

                <label for="status">Já assistiu?</label>
                <input type="radio" id="sim" name="status"><label for="sim">Sim</label>
                <input type="radio" id="nao" name="status"><label for="nao">Não</label><br><br>

                <label for="obs">Observações:</label><br>
                <textarea id="obs" rows="3"></textarea><br><br>

                <button type="button">Salvar</button>
            </form>
        </section>

    <main>
     
    </main>

   
    <footer>
        <p>- CineList</p>
    </footer>

</body>
</html>
